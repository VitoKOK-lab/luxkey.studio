<meta charset="utf-8">
<title>A.C.E. 王牌莊園</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* Layout: full-bleed 3D loft; cream islands, deep-teal ink and A.C.E. orange accents, serif display, card-suit motifs. */
:root{
  --bg:#ece3da; --scene:#ece3da; --panel:#fbf6f2; --panel-2:#f3ebe3; --fg:#17363c; --muted:#6c777b; --line:#e4d9ce;
  --accent:#c9560f; --accent-soft:#fff3ec; --gold:#f37021; --ink:#17363c; --ink-fg:#ffffff;
  --good:#16a34a; --call:#2f7cf6; --meet:#8b5cf6; --idle:#9aa1ad; --bad:#dc2626;
  --d-sales:#c9560f; --d-creative:#17363c; --d-production:#f37021; --d-growth:#3f7f8c;
  --shadow:0 8px 28px rgba(22,26,38,.10),0 1px 2px rgba(22,26,38,.06);
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Helvetica Neue",Helvetica,Arial,"Noto Sans TC",sans-serif;
  --f-display:"Noto Serif TC",Georgia,serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --st:env(safe-area-inset-top, 0px); --sb:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1c; --scene:#141b1e; --panel:#1b2629; --panel-2:#233033; --fg:#f1ece6; --muted:#9aa5a8; --line:#2f3d41;
  --accent:#f37021; --accent-soft:#3a2416; --gold:#f37021; --ink:#f1ece6; --ink-fg:#17363c; --bad:#f87171;
  --d-sales:#f08a4a; --d-creative:#7fb3bf; --d-production:#f37021; --d-growth:#6fb3c2;
  --shadow:0 8px 28px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121a1c; --scene:#141b1e; --panel:#1b2629; --panel-2:#233033; --fg:#f1ece6; --muted:#9aa5a8; --line:#2f3d41;
  --accent:#f37021; --accent-soft:#3a2416; --gold:#f37021; --ink:#f1ece6; --ink-fg:#17363c; --bad:#f87171;
  --d-sales:#f08a4a; --d-creative:#7fb3bf; --d-production:#f37021; --d-growth:#6fb3c2;
  --shadow:0 8px 28px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.island{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);pointer-events:auto}

/* top bar */
.top{position:fixed;top:calc(var(--st) + 12px);left:0;right:0;padding-left:var(--gl);padding-right:var(--gr);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:6}
.brand{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.06em;color:var(--ink);display:block;line-height:1.05}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.logo{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:Georgia,serif;font-size:17px;flex:none}
.segs{display:flex;gap:2px;padding:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.seg{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.seg i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.seg:hover{color:var(--fg);background:var(--panel-2)}
.seg.on{background:var(--ink);color:var(--ink-fg)}
.spacer{flex:1}
.clock{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px}
.clock b{font-size:15px}
.clock small{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
.clock .segs{padding:0;background:var(--panel-2);border-radius:10px}
.clock .seg{padding:5px 8px;font-size:11.5px}
.who{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.who small{display:block;color:var(--muted);font-size:10.5px}
.who b{font-size:12.5px}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;background:var(--panel)}
.bell .badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}

/* row 2 */
.row2{position:fixed;top:calc(var(--st) + 68px);left:0;right:0;padding-left:calc(var(--gl) + 58px);padding-right:var(--gr);display:flex;align-items:flex-start;gap:8px;pointer-events:none;z-index:5;flex-wrap:wrap}
.greet{padding:9px 14px}
.greet h1{font-size:14.5px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.greet p{margin:2px 0 0;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.kpis{display:flex;gap:2px;padding:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.kpi{padding:4px 11px;border-radius:10px;white-space:nowrap}
.kpi small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.kpi b{font-size:14px}
.kpi.hl b{color:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;position:relative}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--fg) 25%,var(--line))}
.btn.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn .rec{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.icon-btn{width:34px;padding:0;justify-content:center}
.menu{position:absolute;top:40px;right:80px;display:flex;flex-direction:column;padding:5px;min-width:180px;z-index:8}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;font-size:12.5px}
.menu button:hover{background:var(--panel-2)}

/* alert */
.alert{position:fixed;top:calc(var(--st) + 124px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:flex;gap:12px;padding:12px 12px 12px 0;z-index:7;overflow:hidden}
.alert .stripe{width:5px;align-self:stretch;background:var(--dc);border-radius:0 4px 4px 0;flex:none}
.alert b{font-size:13.5px}
.alert p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.alert .prop{color:var(--fg)}
.al-body{flex:1;min-width:0}
.al-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.al-act .btn{box-shadow:none;height:30px}
.al-run{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--good)}

/* rail + zoom + minimap */
.rail{max-height:calc(100dvh - 80px);overflow-y:auto;position:fixed;left:var(--gl);top:calc(var(--st) + 68px);display:flex;flex-direction:column;gap:4px;padding:5px;z-index:6}
.rail button{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.rail button.act{background:var(--ink);color:var(--ink-fg)}
.rail button:hover:not(.act){background:var(--panel-2);color:var(--fg)}
.mapbox{position:fixed;right:var(--gr);bottom:calc(var(--sb) + 16px);display:flex;align-items:flex-end;gap:8px;z-index:4}
.zoom{display:flex;flex-direction:column;padding:4px}
.zoom button{width:32px;height:32px;border:0;background:transparent;border-radius:9px;font-size:18px}
.zoom button:hover{background:var(--panel-2)}
.zoom hr{border:0;border-top:1px solid var(--line);margin:2px 6px}
#minimap{width:200px;height:140px;border-radius:12px;display:block;cursor:crosshair}
.mini{padding:5px}
body.drawer .mapbox{right:calc(var(--gr) + 400px)}

/* floating labels */
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);border-bottom:2px solid var(--dc);box-shadow:var(--shadow);font-size:11px;white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform}
.tag b{font-weight:700}
.tag span{color:var(--muted)}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.tag.npc{cursor:default;opacity:.88;pointer-events:none}
.zone.isle{font-size:12px;padding:5px 12px}
.tag.sel{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tag.sel span{color:inherit;opacity:.7}
.tag.neon{border-bottom-color:var(--accent)}
.tag.neon .dot{background:var(--accent)!important}
body.far .tag span{display:none}
body.far .tag{padding:2px 7px 2px 5px;font-size:10px}
.bubble{position:absolute;left:0;top:0;max-width:220px;padding:8px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:11.5px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.bubble.show{opacity:1}
.bubble p{margin:0}
.bubble em{display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.zone{position:absolute;left:0;top:0;border:0;padding:4px 10px;border-radius:7px;background:color-mix(in srgb,var(--dc) 16%,var(--panel));color:var(--fg);font-size:11px;font-weight:700;letter-spacing:.02em;pointer-events:auto;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc) 45%,transparent);will-change:transform;transform-origin:center}
.zone:hover{background:color-mix(in srgb,var(--dc) 28%,var(--panel))}

/* agent card */
.card{position:fixed;left:calc(var(--gl) + 58px);top:calc(var(--st) + 128px);width:284px;padding:14px;z-index:6;max-height:calc(100% - var(--st) - var(--sb) - 150px);overflow-y:auto}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .avatar{width:36px;height:36px;font-size:14px;color:#fff}
.card-h b{font-size:14.5px}
.card-h small{display:block;color:var(--muted);font-size:11px}
.x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:16px;flex:none}
.x:hover{background:var(--panel-2)}
.pill{display:inline-flex;align-items:center;gap:5px;margin:10px 0 8px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel-2)}
.pill i{width:6px;height:6px;border-radius:50%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--panel-2);border-radius:10px;padding:7px 9px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:10.5px}
.stat b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat b.bad{color:var(--bad)}
.meter{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px}
.tasks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.tasks li{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:5px 8px;border-radius:8px;border:1px dashed var(--line)}
.tasks li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tasks em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--accent);margin-right:5px}
.tasks time{color:var(--muted);flex:none;font-size:10.5px}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;font-weight:700}
.quote{margin:10px 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.quote strong{color:var(--fg);font-weight:600}
.card .btn{box-shadow:none;width:100%;justify-content:center}
.card .two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.card .foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

/* panels / drawers */
.panel{position:fixed;left:calc(var(--gl) + 58px);bottom:calc(var(--sb) + 16px);width:320px;max-height:40vh;display:flex;flex-direction:column;z-index:5}
.panel h3,.drawer-h h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.panel h3{padding:11px 14px 8px}
.list{overflow-y:auto;padding:0 6px 8px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:12px;width:100%;border:0;background:transparent;text-align:left}
button.li:hover{background:var(--panel-2)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .bar{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.li .bar i{display:block;height:100%}
.li .v{min-width:64px;text-align:right;font-size:11px}
.li time{color:var(--muted);font-size:10.5px;flex:none}
.li .ev{width:6px;height:6px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:12px;padding:10px 8px;margin:0}
.drawer{position:fixed;top:calc(var(--st) + 68px);right:var(--gr);bottom:calc(var(--sb) + 16px);width:384px;display:flex;flex-direction:column;z-index:7}
.drawer-h{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
.drawer-h b{font-size:14px}
.drawer-h small{display:block;font-size:10.5px;color:var(--muted)}
#an-tabs{margin:10px 12px 0;background:var(--panel-2);border-radius:11px;padding:3px}
#an-tabs .seg{flex:1;justify-content:center}
.an-body{overflow-y:auto;padding:4px 14px 16px;min-height:0;flex:1}
.an-body h4{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.dcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;border-top:3px solid var(--dc)}
.dcard:hover{background:var(--panel-2)}
.dcard small{font-size:10px;font-weight:700;color:var(--dc);letter-spacing:.04em}
.dcard span{font-size:11px;color:var(--muted)}
.dcard b{font-size:17px}
.spark{width:100%;height:26px;margin-top:4px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stats4 .stat{padding:6px 7px}
.stats4 .stat b{font-size:12.5px}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel div{display:grid;grid-template-columns:76px 1fr 38px;align-items:center;gap:8px;font-size:11.5px}
.funnel i{height:14px;border-radius:4px;display:block}
.funnel b{text-align:right;font-size:12px}
.tbl{display:flex;flex-direction:column;gap:4px}
.tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel-2);font-size:11px}
.tr .nm{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;min-width:0}
.tr .nm b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tog.on{border-color:var(--d-traffic);color:var(--d-traffic)}
/* workbench */
.wb-tools{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.wb-tools .btn{box-shadow:none;height:30px;font-size:11.5px;padding:0 10px}
.wb-list{overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.run{border:1px solid var(--line);border-left:3px solid var(--dc);border-radius:12px;padding:10px 12px;background:var(--panel)}
.run header{display:flex;align-items:center;gap:8px}
.run header .avatar{width:26px;height:26px;font-size:11px;background:var(--dc);color:#fff}
.run header b{font-size:12.5px}
.run header small{display:block;font-size:10.5px;color:var(--muted)}
.run .rs{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.run.running .rs{color:var(--meet)}
.run.done .rs{color:var(--good)}
.run pre{margin:8px 0 0;font:inherit;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--fg);max-height:260px;overflow-y:auto}
.run.queued pre{display:none}
.run.running pre:empty::after{content:'思考中…';color:var(--muted)}
.run-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wbadge{position:absolute;top:4px;right:4px;min-width:14px;height:14px;border-radius:7px;background:var(--meet);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail button{position:relative}

/* chat */
.orb{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffc59a,var(--gold) 55%,#17363c);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 55%,transparent);flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.m{max-width:88%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--ink);color:var(--ink-fg);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.m.sys{align-self:center;background:transparent;color:var(--muted);font-size:11px;padding:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:11.5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);padding:0 12px;font-size:13px}
.compose .btn{box-shadow:none;height:38px}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);display:grid;place-items:center;z-index:9;padding-left:var(--gl);padding-right:var(--gr)}
.modal{width:min(380px,100%);padding:18px}
.modal h2{margin:0 0 4px;font-size:16px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:11.5px;color:var(--muted);font-weight:600}
.field input,.field select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;font-size:13px;color:var(--fg);font-weight:500}
.modal .chips{padding:0 0 12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modal .btn{box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 20px);transform:translate(-50%,20px);opacity:0;transition:.3s;padding:9px 14px;font-size:12.5px;font-weight:600;z-index:10;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px;color:var(--muted)}
.tour{position:fixed;left:50%;bottom:calc(var(--sb) + 20px);transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:14px 16px;z-index:8}
.tour b{font-size:13px;color:var(--gold);letter-spacing:.04em}
.tour p{margin:4px 0 10px;font-size:12.5px;line-height:1.55}
.tour .row{display:flex;gap:8px;justify-content:flex-end}
.tour .btn{box-shadow:none;height:30px}
.ctx{position:fixed;top:0;left:0;right:auto;z-index:9;min-width:170px}
.ctx small{display:block;padding:6px 10px 4px;font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:3px}
.statbar{position:fixed;left:50%;bottom:calc(var(--sb) + 4px);transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:3;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.tag.hover{border-color:var(--gold)}
.estate-exterior .tag,.estate-exterior .bubble,.estate-exterior .estate-room-label{visibility:hidden!important;pointer-events:none}
.an-body .chips{padding:0}
.an-body .chip{cursor:default}
@media (max-width:760px){.statbar{display:none}}

@media (max-width:980px){ .who div,.greet{display:none} .clock small{display:none} }
/* phone: top HUD (brand+clock / departments / KPI strip), bottom dock (action chips + tab bar) */
@media (max-width:760px){
  :root{ --tab:56px; --dock:calc(var(--sb) + 10px + var(--tab)); --acts:calc(var(--dock) + 8px + 36px) }
  .top{flex-wrap:wrap;top:calc(var(--st) + 8px);gap:6px;padding-left:12px;padding-right:12px}
  .brand{padding:5px 12px 5px 6px;gap:7px}
  .brand b{font-size:15px}
  .logo{width:26px;height:26px;font-size:15px}
  .top .segs#depts{order:5;flex-basis:100%;padding:3px}
  #depts .seg{padding:5px 10px;font-size:12px}
  .who,.bell{display:none}
  .clock{padding:3px 3px 3px 10px;gap:8px}
  .clock b{font-size:14px}
  .clock .seg{padding:5px 7px}
  .row2{top:calc(var(--st) + 96px);padding-left:12px;padding-right:12px;z-index:7}
  .kpis{flex:1 1 100%;padding:3px}
  .kpi{padding:3px 9px}
  .kpi small{font-size:10px}
  .kpi b{font-size:13px}
  /* actions become a horizontally scrolling chip row above the tab bar */
  .actions{position:fixed;left:0;right:0;bottom:var(--dock);margin-bottom:8px;padding:0 12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;pointer-events:auto}
  .actions::-webkit-scrollbar{display:none}
  .actions .btn{height:36px;flex:none;border-radius:999px;padding:0 13px;font-size:12px}
  .actions .icon-btn{width:36px;padding:0}
  #b-ask{display:none}
  .actions .menu{position:fixed;top:auto;right:12px;bottom:calc(var(--acts) + 6px)}
  /* rail becomes the bottom tab bar */
  .rail{top:auto;bottom:calc(var(--sb) + 10px);left:12px;right:12px;flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:4px;border-radius:18px;z-index:7}
  .rail button{flex:0 0 64px;width:64px;height:48px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .rail button svg.i{width:19px;height:19px}
  .rail button::after{content:attr(aria-label);font-size:10px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .rail #v-roof::after{content:"剖面"}
  .rail .wbadge{top:3px;right:calc(50% - 22px)}
  .mapbox,.statbar{display:none}
  /* sheets */
  .card{left:0;right:0;width:auto;top:auto;bottom:0;max-height:64vh;border-radius:20px 20px 0 0;padding:14px 16px calc(var(--sb) + 16px);z-index:8}
  .card::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
  .panel{left:12px;right:12px;width:auto;bottom:calc(var(--acts) + 8px);max-height:34vh}
  .drawer{left:12px;right:12px;width:auto;top:calc(var(--st) + 56px);bottom:calc(var(--dock) + 8px);border-radius:18px}
  body.drawer .actions{visibility:hidden}
  .alert{top:calc(var(--st) + 150px);width:calc(100% - 24px)}
  .tour,.toast{bottom:calc(var(--acts) + 10px)}
  .tour{width:calc(100% - 24px)}
  /* labels in the scene */
  .tag{font-size:10px;padding:2px 7px 2px 5px;gap:4px}
  .tag .dot{width:6px;height:6px}
  .tag span{display:none}
  .zone{font-size:10px;padding:3px 7px;border-radius:6px;opacity:.92}
  .bubble{max-width:170px;font-size:11px;padding:6px 9px}
  .modal{padding:16px}
}
@media (max-width:420px){ .brand small{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
/* The facade display can also be read in a keyboard-accessible large view. */
#broadcast-dialog{width:min(1080px,92vw);max-height:90dvh;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--fg)}
#broadcast-dialog::backdrop{background:rgba(8,20,24,.72)}
#broadcast-dialog header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#broadcast-dialog canvas{display:block;width:100%;height:auto;border-radius:10px}
</style>
